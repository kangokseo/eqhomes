   html+=`<h3>승인 권한</h3><p>등록된 검증자의 서버 인증·은행 수동 확인이 필요합니다. 이름 입력이나 로컬 저장으로 승인할 수 없습니다.</p><button disabled title="인증된 승인 백엔드 미구현">은행 입금 승인 · 읽기 전용</button>`;
  }else{
   html+=`<dl><dt>유닛 / 마지막 자료 날짜</dt><dd>${E(r.unit)} · ${E(r.last_date)}</dd><dt>담당</dt><dd>${E(r.assignee)}</dd><dt>기록 내용</dt><dd>${E(r.note)}</dd><dt>다음 작업</dt><dd>${E(r.next_action)}</dd>${tab==='applicants'?'<dt>투어 제안 (예약 아님)</dt><dd>'+E(r.tour_date||'없음 / 미확인')+'</dd>':'<dt>완료 증빙·임차인 확인</dt><dd>'+E(r.completion_evidence||'미확인')+'</dd>'}</dl><div class="actions"><button id="edit-selected">로컬 초안 편집</button>${tab==='applicants'?'<button id="reply-draft">회신 / 투어 제안 초안</button>':''}</div>`;
  }
  html+=`<h3>출처</h3><p class="footnote">${E(r.source)}<br>사진·첨부 내용 미검증. 스냅샷 이후 변경은 확인되지 않았습니다.</p>`;
  $('inspector').innerHTML=html;
  if($('edit-selected'))$('edit-selected').onclick=()=>openEditor(r);
  if($('reply-draft'))$('reply-draft').onclick=()=>openEditor({...r,note:r.note+'\n[미발송 회신 초안] 현재 관심/희망 입주일 및 투어 가능 시간을 확인해 주세요.'});
 }
 function openEditor(r){
  editing=r||null;const f=$('draft-form'),repair=tab==='repairs';f.reset();$('form-heading').textContent=repair?'수리 요청 · 로컬 초안':'지원자 / 투어 요청 · 로컬 초안';$('name-label').textContent=repair?'수리 요청 제목':'문의자 이름';
  ['room-field','tour-field'].forEach(id=>$(id).classList.toggle('hidden',repair));['severity-field','evidence-field'].forEach(id=>$(id).classList.toggle('hidden',!repair));
  const states=repair?repairStates:applicantStates;f.elements.status.innerHTML=[...new Set([r?.status,...states].filter(Boolean))].map(s=>`<option>${E(s)}</option>`).join('');
  for(const name of ['name','unit','room','status','tour_date','severity','assignee','last_date','note','next_action','completion_evidence']){
   let v=name==='name'&&repair?r?.title:r?.[name];if(name==='last_date'&&!/^\d{4}-\d{2}-\d{2}$/.test(v||''))v='';if(v!=null)f.elements[name].value=v;
  }
  $('form-error').textContent='';$('editor').showModal();
 }
 function saveDraft(r){
  const current=drafts[tab].filter(x=>x.id!==r.id);current.push(r);const candidate={...drafts,[tab]:current};
  try{localStorage.setItem(key,JSON.stringify(candidate));drafts=candidate;return true;}catch(e){$('form-error').textContent='브라우저 저장 실패. 저장된 것으로 처리하지 않았습니다.';return false;}
 }
 function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 $('draft-form').onsubmit=e=>{
  e.preventDefault();const f=$('draft-form'),r={...(editing||{}),id:editing?.id||'local-'+Date.now(),draft:true,evidence:'manual-local',source:(editing?.source||'수동 입력')+' · 로컬 초안 / 원본 미반영'};
  for(const name of ['name','unit','room','status','tour_date','severity','assignee','last_date','note','next_action','completion_evidence'])r[name]=f.elements[name].value.trim();
  r.title=tab==='repairs'?r.name:r.name;r.last_date=r.last_date||'수동 확인일 미기재';r.assignee=r.assignee||'배정 미확인';
  const errors=Ops.validateDraft(tab,r);if(errors.length){$('form-error').textContent=errors.join(' ');return;}
  // 공유 미리보기에서는 입력된 이름과 자유 텍스트를 저장하거나 내보내지 않습니다.
  const safe=DATA.preview?Ops.shareDraft(r):r;
  if(!saveDraft(safe))return;selected=safe.id;$('editor').close();render();announce(DATA.preview?'익명화한 초안을 이 브라우저에 저장했습니다. 개인명/자유 입력은 생략했습니다.':'이 브라우저에 초안을 저장했습니다. 원본/공유 장부는 변경하지 않았습니다.');
 };
 $('cancel').onclick=()=>$('editor').close();$('add').onclick=()=>openEditor();
 $('reset').onclick=()=>{if(!confirm('이 브라우저의 지원자·수리 초안을 모두 지울까요? 원본은 유지됩니다.'))return;try{localStorage.removeItem(key);drafts={applicants:[],repairs:[]};render();announce('로컬 초안만 초기화했습니다.');}catch(e){announce('로컬 저장 삭제 실패.');}};
 $('download').onclick=()=>{const output={kind:'local-draft-export-not-canonical',preview:DATA.preview,generated_at:DATA.generated_at,exported_at:new Date().toISOString(),selected_month:month,applicants:merged('applicants'),repairs:merged('repairs'),rent:DATA.rent,pending_bank:DATA.pending_bank,notice_reviews:DATA.notice_reviews};download('plymouth-operations-'+(DATA.preview?'sanitized':'private')+'-drafts.json',JSON.stringify(output,null,2),'application/json');announce('전체 기록과 로컬 초안을 JSON으로 내보냈습니다. 원본으로 자동 반영되지 않습니다.');};
 $('csv').onclick=()=>{
  const head=['target_month','row_type','unit','bedroom','tenant_or_payer','expected_cents','confirmed_cents','remaining_cents','unitemized_nonadditive_cents','status'];
  const lines=report().rows.map(r=>[month,'contract',r.unit,r.bedroom,r.name,r.expected_cents,r.confirmed_cents,r.remaining_cents,r.unitemized_cents,r.status]);
  report().unresolved.forEach(p=>lines.push([month,'unresolved_match','','',p.payer,'',p.confirmed_cents,'','','매칭 미확인']));
  const csv=[head,...lines].map(line=>line.map(Ops.csvCell).join(',')).join('\r\n');download('plymouth-rent-'+month+'.csv','\ufeff'+csv,'text/csv;charset=utf-8');announce(month+' 전체 계약 및 미해결 매칭 CSV를 내보냈습니다. 필터는 내보내기 범위를 줄이지 않습니다.');
 };
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;selected=null;$('status').value='';$('search').value='';render();});
 $('month').innerHTML=Object.keys(DATA.rent).map(m=>`<option>${m}</option>`).join('');$('month').value=month;$('month').onchange=()=>{month=$('month').value;selected=null;render();};
 ['search','unit','status'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));
 $('table').onclick=e=>{const b=e.target.closest('[data-select]');if(b){selected=b.dataset.select;render();}};
 $('mode').textContent=DATA.preview?'익명 공유 미리보기':'비공개 로컬 · 개인 정보';$('snapshot').textContent=(DATA.live?'원본 조회 ':'파일 스냅샷 · 생성 ')+DATA.generated_at;
 $('connection-mode').textContent=DATA.live?'비공개 로컬 원본 연결 · 60초 자동 대조 / 외부 발송·승인 없음':'파일 스냅샷 · 서버에서 매일 재생성 / 다운로드 파일 자동 갱신 없음';
 let polling=false;
 async function pollLive(){
  if(polling)return;polling=true;
  try{
   const next=await Ops.fetchLatest(DATA,location,fetch);
   if(!next)return;
   DATA=next;
   if(!DATA.rent[month])month=DATA.default_month;
   $('month').innerHTML=Object.keys(DATA.rent).map(m=>`<option>${m}</option>`).join('');$('month').value=month;
   $('snapshot').textContent='원본 조회 '+DATA.generated_at+' · 60초 자동 대조';
   render();announce('최신 원본 연결 · 은행 입금 승인 읽기 전용');
  }catch(e){announce('갱신 실패 · 이전 자료 표시 / 마지막 원본 조회 '+DATA.generated_at);$('snapshot').textContent='오래된 자료 가능 · 마지막 조회 '+DATA.generated_at;}
  finally{polling=false;}
 }
 globalThis.OperationsApp={get data(){return DATA;},getDrafts:()=>drafts,getTab:()=>tab,render,pollLive};render();
 if(!DATA.preview && DATA.live && location.protocol==='http:' && ['127.0.0.1','localhost'].includes(location.hostname))setInterval(pollLive,60000);
})();
}

</script></body></html>
